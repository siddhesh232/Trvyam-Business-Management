# Local development SQL Server. Set MSSQL_SA_PASSWORD in your shell or a git-ignored .env file.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD (min 8 chars, upper/lower/digit/symbol)}
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
volumes:
  sqldata:
