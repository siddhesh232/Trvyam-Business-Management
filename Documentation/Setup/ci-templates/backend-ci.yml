name: Backend CI
on:
  push:
    branches: [main]
    paths: ['Backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['Backend/**']
jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BusinessManagement.sln
      - run: dotnet build BusinessManagement.sln --no-restore -c Release
      - run: dotnet test BusinessManagement.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Backend/**/TestResults/*.trx
